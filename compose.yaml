name: local-ai-api

x-gateway-environment: &gateway-environment
  OLLAMA_BASE_URL: http://127.0.0.1:11434
  HOST: 0.0.0.0
  PORT: "8080"
  DEFAULT_MODEL_PROFILE: ${DEFAULT_MODEL_PROFILE:-main}
  DEFAULT_WHISPER_MODEL: ${DEFAULT_WHISPER_MODEL:-none}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
  WHISPER_CACHE_DIR: ${WHISPER_CACHE_DIR:-/models/cache/whisper}
  CHATTERBOX_MODEL: ${CHATTERBOX_MODEL:-chatterbox}
  CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-auto}
  WARM_AUDIO_ON_START: ${WARM_AUDIO_ON_START:-false}
  XDG_CACHE_HOME: /models/cache
  HF_HOME: /models/cache/huggingface
  TORCH_HOME: /models/cache/torch
  ENABLE_ARBITRARY_MODELS: ${ENABLE_ARBITRARY_MODELS:-false}
  AGENT_ZERO_ENABLED: "true"
  ENABLE_API_KEY_AUTH: ${ENABLE_API_KEY_AUTH:-false}
  API_KEY: ${API_KEY:-}
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-600}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
  REPO_OPS_AUTONOMY_ENABLED: ${REPO_OPS_AUTONOMY_ENABLED:-false}
  REPO_OPS_AUTONOMY_MAX_STORAGE_GIB: ${REPO_OPS_AUTONOMY_MAX_STORAGE_GIB:-20}
  AGENT_ZERO_COCKPIT_ENABLED: ${AGENT_ZERO_COCKPIT_ENABLED:-false}
  AGENT_ZERO_PORT: ${AGENT_ZERO_PORT:-50080}

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  model-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    restart: "no"
    network_mode: service:ollama
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        models="${OLLAMA_MODELS:-qwen3.5:9b qwen3.5:4b qwen3.5:0.8b qwen3:14b qwen3:8b}"
        pulled=""
        for model in $$models; do
          case " $$pulled " in
            *" $$model "*) continue ;;
          esac
          pulled="$$pulled $$model"
          ollama pull "$$model"
        done
    depends_on:
      ollama:
        condition: service_healthy

  gateway:
    image: local-ai-api-gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_AUDIO: ${INSTALL_AUDIO:-true}
        INSTALL_RAG: ${INSTALL_RAG:-false}
    restart: unless-stopped
    network_mode: service:ollama
    environment: *gateway-environment
    volumes:
      # Bind-mount the host repo so the container has a live .git checkout.
      # This lets app_update.py run `git pull` inside the container and have
      # it take effect on the host source tree.  Python packages are installed
      # to the system Python path (not /app), so this mount does not shadow them.
      - type: bind
        source: .
        target: /app
      - gateway-model-cache:/models/cache
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      # Restarted by the autoheal watchdog below if it becomes unhealthy.
      autoheal: "true"

  # Watchdog. Docker's restart policy only reacts to a full crash/exit, so a
  # gateway that hangs (process alive but HTTP dead) would otherwise stay up and
  # broken. This sidecar watches containers labeled autoheal=true and restarts
  # them when Docker's own healthcheck marks them unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "90"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  repo-updater:
    # Poll GitHub from inside Docker and recreate the gateway only after a
    # clean fast-forward update of main. Access to the Docker socket is needed
    # solely to build and restart the gateway container.
    image: docker:27-cli
    restart: unless-stopped
    environment:
      REPO_DIR: /repo
      REPO_UPDATE_REMOTE: ${REPO_UPDATE_REMOTE:-origin}
      REPO_UPDATE_BRANCH: ${REPO_UPDATE_BRANCH:-main}
      REPO_UPDATE_INTERVAL_SECONDS: ${REPO_UPDATE_INTERVAL_SECONDS:-300}
      # Optional, space-separated Compose files for non-standard deployments.
      # When omitted, the updater discovers the active accelerator, Qdrant,
      # and Agent Zero overlays from the running Compose project.
      REPO_UPDATE_COMPOSE_FILES: ${REPO_UPDATE_COMPOSE_FILES:-}
    volumes:
      - type: bind
        source: .
        target: /repo
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache git >/dev/null
        git config --global --add safe.directory /repo
        exec /bin/sh /repo/scripts/docker-repo-updater.sh

volumes:
  ollama-data:
  gateway-model-cache:
