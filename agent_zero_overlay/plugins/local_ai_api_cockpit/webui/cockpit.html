<html><head><script type="module" src="/plugins/local_ai_api_cockpit/webui/cockpit.js"></script></head>
<body><section class="local-ai-api-cockpit" x-data>
  <header><h2>Disposable workspaces</h2><button type="button" @click="window.localAiApiCockpit.create()">Create</button><button type="button" @click="window.localAiApiCockpit.refresh()">Refresh</button></header>
  <p>Runs track bounded evidence and checks. They never make edits unless an approved agent separately uses a workspace edit tool.</p>
  <p x-text="window.localAiApiCockpit.message"></p>
  <p x-show="window.localAiApiCockpit.candidate" x-text="window.localAiApiCockpit.candidate?.message"></p>
  <template x-for="workspace in window.localAiApiCockpit.workspaces" :key="workspace.task_id">
    <article><strong x-text="workspace.task_id"></strong><span x-text="workspace.state"></span><button type="button" @click="window.localAiApiCockpit.inspect(workspace.task_id)">Evidence</button><button type="button" @click="window.localAiApiCockpit.action('start_autonomous_run', {task_id: workspace.task_id})">Start</button><button type="button" @click="window.localAiApiCockpit.action('evaluate_workspace', {task_id: workspace.task_id})">Evaluate</button><button type="button" @click="window.localAiApiCockpit.action('preview_workspace', {task_id: workspace.task_id})">Preview</button><button type="button" @click="window.localAiApiCockpit.pause(workspace.task_id)">Pause</button><button type="button" @click="window.localAiApiCockpit.action('resume_autonomous_run', {task_id: workspace.task_id})">Resume</button><button type="button" @click="window.localAiApiCockpit.stop(workspace.task_id)">Stop</button><button type="button" @click="window.localAiApiCockpit.action('archive_workspace', {task_id: workspace.task_id})">Archive</button></article>
  </template>
  <pre x-show="window.localAiApiCockpit.evidence" x-text="window.localAiApiCockpit.evidence"></pre>
  <p>Review-ready evidence can be inspected here; merging, pushing, and deployment remain unavailable.</p>
</section></body></html>
