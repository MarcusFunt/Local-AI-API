services:
  agent-zero:
    image: local-ai-api-agent-zero-cockpit:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.agent-zero-cockpit
      args:
        AGENT_ZERO_BASE_IMAGE: ${AGENT_ZERO_BASE_IMAGE:-agent0ai/agent-zero@sha256:7f8bc5cc77c3ab9fb1216a51dc0ae7f65f0536b3a31dd74b600287818ac140bc}
    restart: unless-stopped
    environment:
      API_KEY_OTHER: ${API_KEY:-unused}
      # Agent Zero's normal profile exceeds the usable prompt budget of the
      # local 8k model. This dedicated profile keeps only the operational
      # tools that fit reliably beside a 14B model's strict JSON contract.
      A0_SET_agent_profile: agent0
      A0_SET__model_config__chat_model__provider: other
      A0_SET__model_config__chat_model__name: agent
      A0_SET__model_config__chat_model__api_base: http://host.docker.internal:8080/v1
      A0_SET__model_config__chat_model__ctx_length: "${AGENT_CONTEXT_LENGTH:-8192}"
      A0_SET__model_config__utility_model__provider: other
      A0_SET__model_config__utility_model__name: agent
      A0_SET__model_config__utility_model__api_base: http://host.docker.internal:8080/v1
      A0_SET__model_config__utility_model__ctx_length: "${AGENT_CONTEXT_LENGTH:-8192}"
      A0_SET__model_config__embedding_model__provider: huggingface
      A0_SET__model_config__embedding_model__name: sentence-transformers/all-MiniLM-L6-v2
      A0_SET__model_config__embedding_model__api_base: ""
      AGENT_ZERO_COCKPIT_ENABLED: ${AGENT_ZERO_COCKPIT_ENABLED:-false}
      GATEWAY_STATUS_URL: http://host.docker.internal:8080/status.json
      REPO_OPS_MCP_URL: http://repo-ops:8090/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - |
        /opt/venv-a0/bin/python - <<'PY'
        import json
        import os
        from pathlib import Path

        def seed_tree(source: Path, destination: Path) -> None:
            """Install Local AI API quality seeds without overwriting user edits."""
            if not source.exists():
                return
            for item in source.rglob("*"):
                relative = item.relative_to(source)
                target = destination / relative
                if item.is_dir():
                    target.mkdir(parents=True, exist_ok=True)
                elif not target.exists():
                    target.parent.mkdir(parents=True, exist_ok=True)
                    target.write_bytes(item.read_bytes())

        seed_tree(Path("/opt/local-ai-api-quality/profiles"), Path("/a0/usr/agents"))
        seed_tree(Path("/opt/local-ai-api-quality/projects"), Path("/a0/usr/projects"))
        projects_root = Path("/a0/usr/projects")
        for project in (projects_root.iterdir() if projects_root.exists() else ()):
            if not project.is_dir():
                continue
            for meta_dir in ("instructions", "knowledge", "skills", "memory"):
                (project / ".a0proj" / meta_dir).mkdir(parents=True, exist_ok=True)

        key = os.environ.get("API_KEY_OTHER", "").strip()
        if key:
            env_path = Path("/a0/usr/.env")
            env_path.parent.mkdir(parents=True, exist_ok=True)
            lines = env_path.read_text(encoding="utf-8").splitlines() if env_path.exists() else []
            rendered = []
            updated = False
            for line in lines:
                if line.startswith("API_KEY_OTHER="):
                    rendered.append(f"API_KEY_OTHER={key}")
                    updated = True
                else:
                    rendered.append(line)
            if not updated:
                if rendered and rendered[-1].strip():
                    rendered.append("")
                rendered.append(f"API_KEY_OTHER={key}")
            env_path.write_text("\n".join(rendered).rstrip() + "\n", encoding="utf-8")

        config_path = Path("/a0/usr/plugins/_model_config/config.json")
        config_path.parent.mkdir(parents=True, exist_ok=True)
        try:
            config = json.loads(config_path.read_text(encoding="utf-8")) if config_path.exists() else {}
        except (OSError, json.JSONDecodeError):
            config = {}
        if not isinstance(config, dict):
            config = {}
        managed_models = {
            "chat_model": {
                "provider": "other",
                "name": "agent",
                "api_base": "http://host.docker.internal:8080/v1",
                "ctx_length": int(os.environ.get("AGENT_CONTEXT_LENGTH", "8192")),
                "ctx_history": 0.7,
                # Agent Zero parses every chat-model turn as a tool call.  Make
                # Ollama constrain the response to that parser's required shape
                # rather than relying on prompt wording alone.
                "kwargs": {
                    "response_format": {
                        "type": "json_schema",
                        "json_schema": {
                            "name": "agent_zero_tool_call",
                            "schema": {
                                "type": "object",
                                "properties": {
                                    "tool_name": {"type": "string"},
                                    "tool_args": {"type": "object"},
                                },
                                "required": ["tool_name", "tool_args"],
                                "additionalProperties": False,
                            },
                        },
                    },
                },
            },
            "utility_model": {
                "provider": "other",
                "name": "agent",
                "api_base": "http://host.docker.internal:8080/v1",
                "ctx_length": int(os.environ.get("AGENT_CONTEXT_LENGTH", "8192")),
                "ctx_input": 0.7,
            },
            "embedding_model": {
                "provider": "huggingface",
                "name": "sentence-transformers/all-MiniLM-L6-v2",
                "api_base": "",
            },
        }
        for section, values in managed_models.items():
            current = config.get(section, {})
            if not isinstance(current, dict):
                current = {}
            current.update(values)
            config[section] = current
        config_path.write_text(
            json.dumps(config, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY
        exec /exe/initialize.sh "$${BRANCH:-main}"
    volumes:
      - agent-zero-data:/a0/usr
    ports:
      - "127.0.0.1:${AGENT_ZERO_PORT:-50080}:80"
    depends_on:
      gateway:
        condition: service_healthy
    labels:
      local-ai-api.component: agent-zero

volumes:
  agent-zero-data:
