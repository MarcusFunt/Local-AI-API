services:
  agent-zero:
    image: local-ai-api-agent-zero-cockpit:latest
    build:
      context: .
      dockerfile: Dockerfile.agent-zero-cockpit
      args:
        AGENT_ZERO_IMAGE_TAG: ${AGENT_ZERO_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_KEY_OTHER: ${API_KEY:-unused}
      A0_SET__model_config__chat_model__provider: other
      A0_SET__model_config__chat_model__name: agent
      A0_SET__model_config__chat_model__api_base: http://host.docker.internal:8080/v1
      A0_SET__model_config__utility_model__provider: other
      A0_SET__model_config__utility_model__name: agent-utility
      A0_SET__model_config__utility_model__api_base: http://host.docker.internal:8080/v1
      AGENT_ZERO_COCKPIT_ENABLED: ${AGENT_ZERO_COCKPIT_ENABLED:-false}
      REPO_OPS_MCP_URL: http://repo-ops:8090/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - |
        python - <<'PY'
        import os
        from pathlib import Path

        key = os.environ.get("API_KEY_OTHER", "").strip()
        if key:
            env_path = Path("/a0/usr/.env")
            env_path.parent.mkdir(parents=True, exist_ok=True)
            lines = env_path.read_text(encoding="utf-8").splitlines() if env_path.exists() else []
            rendered = []
            updated = False
            for line in lines:
                if line.startswith("API_KEY_OTHER="):
                    rendered.append(f"API_KEY_OTHER={key}")
                    updated = True
                else:
                    rendered.append(line)
            if not updated:
                if rendered and rendered[-1].strip():
                    rendered.append("")
                rendered.append(f"API_KEY_OTHER={key}")
            env_path.write_text("\n".join(rendered).rstrip() + "\n", encoding="utf-8")
        PY
        exec /exe/initialize.sh "$${BRANCH:-main}"
    volumes:
      - agent-zero-data:/a0/usr
    ports:
      - "127.0.0.1:${AGENT_ZERO_PORT:-50080}:80"
    depends_on:
      gateway:
        condition: service_healthy
    labels:
      local-ai-api.component: agent-zero

volumes:
  agent-zero-data:
