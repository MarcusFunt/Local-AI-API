name: local-ai-api

# Deliberately separate from Agent Zero's persistent volume and the repository.
# Use only as a disposable quarantine for untrusted skills/plugins.
services:
  agent-skill-sandbox:
    image: ${AGENT_ZERO_BASE_IMAGE:-agent0ai/agent-zero@sha256:7f8bc5cc77c3ab9fb1216a51dc0ae7f65f0536b3a31dd74b600287818ac140bc}
    profiles:
      - skill-quarantine
    restart: "no"
    environment:
      API_KEY_OTHER: ""
    volumes:
      - agent-skill-quarantine:/a0/usr
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      local-ai-api.component: agent-skill-quarantine

volumes:
  agent-skill-quarantine:
