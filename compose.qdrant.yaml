name: local-ai-api

# Qdrant vector store overlay for the RAG pipeline.
#
# Usage:
#   docker compose -f compose.yaml -f compose.qdrant.yaml [-f compose.cpu.yaml|...] up -d
#
# Before starting, pull the embedding model once:
#   docker compose exec ollama ollama pull nomic-embed-text
#
# Then enable RAG in your .env:
#   RAG_ENABLED=true
#   QDRANT_URL=http://127.0.0.1:6333

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286}
    restart: unless-stopped
    # Share the ollama service's network namespace so Qdrant is reachable
    # at 127.0.0.1:6333 by both the gateway and Ollama containers.
    network_mode: service:ollama
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://127.0.0.1:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    build:
      args:
        INSTALL_RAG: ${INSTALL_RAG:-true}
    environment:
      RAG_ENABLED: ${RAG_ENABLED:-true}
      QDRANT_URL: ${QDRANT_URL:-http://127.0.0.1:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-local-ai-api-docs}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      RAG_EMBED_DIM: ${RAG_EMBED_DIM:-768}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-512}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-64}
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant-data:
