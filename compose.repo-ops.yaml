name: local-ai-api

# Opt-in Agent Zero repository worker. It publishes no host port and is only
# discoverable by other containers in this Compose project (not Tailscale).
services:
  repo-ops:
    build:
      context: .
      dockerfile: Dockerfile.repo-ops
    restart: unless-stopped
    environment:
      REPO_OPS_SOURCE_ROOT: /source
      REPO_OPS_WORKSPACES_ROOT: /workspaces
      REPO_OPS_JOBS_ROOT: /jobs
      # GitNexus labels the clone by the read-only /source mount origin.
      REPO_OPS_GITNEXUS_REPO: source
      REPO_OPS_ARCHIVE_ROOT: /archives
      REPO_OPS_LEARNING_ROOT: /archives/learning
      REPO_OPS_ACTIVE_LEASE_HOURS: ${REPO_OPS_ACTIVE_LEASE_HOURS:-24}
      REPO_OPS_WORKSPACE_TTL_DAYS: ${REPO_OPS_WORKSPACE_TTL_DAYS:-7}
      REPO_OPS_ARCHIVE_TTL_DAYS: ${REPO_OPS_ARCHIVE_TTL_DAYS:-14}
      REPO_OPS_AUTONOMY_ENABLED: ${REPO_OPS_AUTONOMY_ENABLED:-false}
      REPO_OPS_AUTONOMY_MAX_STORAGE_GIB: ${REPO_OPS_AUTONOMY_MAX_STORAGE_GIB:-20}
    volumes:
      - type: bind
        source: .
        target: /source
        read_only: true
      - type: volume
        source: repo-ops-workspaces
        target: /workspaces
      - type: volume
        source: repo-ops-jobs
        target: /jobs
      - type: bind
        source: ${REPO_OPS_ARCHIVE_HOST_PATH:-./.local/repo-ops-archives}
        target: /archives
    expose:
      - "8090"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      gateway:
        condition: service_healthy
    labels:
      local-ai-api.component: repo-ops

  # No MCP endpoint, source checkout, Agent Zero volume, or network. This is
  # the only component allowed to perform the scheduled destructive cleanup.
  repo-ops-lifecycle:
    build:
      context: .
      dockerfile: Dockerfile.repo-ops
    restart: unless-stopped
    command: ["python", "-m", "repo_ops.lifecycle"]
    network_mode: none
    environment:
      REPO_OPS_WORKSPACES_ROOT: /workspaces
      REPO_OPS_ARCHIVE_ROOT: /archives
      REPO_OPS_WORKSPACE_TTL_DAYS: ${REPO_OPS_WORKSPACE_TTL_DAYS:-7}
      REPO_OPS_ARCHIVE_TTL_DAYS: ${REPO_OPS_ARCHIVE_TTL_DAYS:-14}
      REPO_OPS_SWEEP_INTERVAL_SECONDS: ${REPO_OPS_SWEEP_INTERVAL_SECONDS:-21600}
    volumes:
      - type: volume
        source: repo-ops-workspaces
        target: /workspaces
      - type: bind
        source: ${REPO_OPS_ARCHIVE_HOST_PATH:-./.local/repo-ops-archives}
        target: /archives
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      local-ai-api.component: repo-ops-lifecycle

  # Processes preview and fixed verification jobs. It has no network, source
  # checkout, archive mount, Agent Zero state, MCP endpoint, or host port. The
  # disposable workspaces are mounted read-only; it writes only job evidence.
  repo-ops-preview:
    build:
      context: .
      dockerfile: Dockerfile.repo-ops
    restart: unless-stopped
    command: ["python", "-m", "repo_ops.preview_worker"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g
      - /run:rw,nosuid,nodev,noexec,size=16m
    environment:
      REPO_OPS_WORKSPACES_ROOT: /workspaces
      REPO_OPS_JOBS_ROOT: /jobs
      PYTHONDONTWRITEBYTECODE: "1"
      REPO_OPS_WORKER_TIMEOUT_SECONDS: "600"
    volumes:
      - type: volume
        source: repo-ops-workspaces
        target: /workspaces
        read_only: true
      - type: volume
        source: repo-ops-jobs
        target: /jobs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    labels:
      local-ai-api.component: repo-ops-preview

volumes:
  repo-ops-workspaces:
  repo-ops-jobs:
