name: Audio integration

# Loading Whisper + Chatterbox is heavy (downloads ~1-2 GB of model weights and
# runs CPU inference), so this does not gate PRs. It runs nightly and on demand
# to catch dependency rot in the audio stack (e.g. the resemble-perth /
# setuptools break that silently disabled Chatterbox TTS).
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  audio-roundtrip:
    name: Chatterbox TTS -> Whisper STT round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build gateway image (audio-enabled)
        run: docker compose -f compose.yaml -f compose.cpu.yaml build gateway

      - name: Start gateway (audio only; no Ollama needed)
        run: |
          docker run -d --name gateway \
            -p 127.0.0.1:8080:8080 \
            -e HOST=0.0.0.0 \
            -e DEFAULT_WHISPER_MODEL=base \
            local-ai-api-gateway:1.0.0
          echo "Waiting for /health..."
          for i in $(seq 1 60); do
            if curl -fsS -m 3 http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "gateway healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::gateway did not become healthy"; docker logs gateway; exit 1

      - name: Install test dependencies
        run: pip install httpx pytest

      - name: Run audio round-trip test
        env:
          GATEWAY_BASE_URL: http://127.0.0.1:8080
        run: pytest tests/integration -m integration -v

      - name: Gateway logs on failure
        if: failure()
        run: docker logs gateway
