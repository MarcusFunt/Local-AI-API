name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    name: Shell scripts are LF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on CRLF line endings in *.sh
        run: |
          python3 - <<'PY'
          import subprocess, sys
          files = subprocess.check_output(["git", "ls-files", "*.sh"]).decode().split()
          bad = [f for f in files if b"\r" in open(f, "rb").read()]
          if bad:
              print("::error::CRLF line endings found in shell scripts (must be LF):")
              for f in bad:
                  print(f"  {f}")
              sys.exit(1)
          print(f"OK: all {len(files)} shell scripts use LF line endings.")
          PY

  test-in-image:
    name: Build image + run test suite
    runs-on: ubuntu-latest
    # Chat-only image keeps CI fast; the unit suite mocks Ollama and the audio
    # stack, so it passes without the heavy Whisper/Chatterbox dependencies.
    # (Audio models get their own opt-in integration workflow.)
    env:
      INSTALL_AUDIO: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Build gateway image
        run: docker compose -f compose.yaml -f compose.cpu.yaml build gateway

      - name: Run test suite inside the built image
        run: |
          docker run --rm \
            --user root \
            --entrypoint /bin/sh \
            --mount type=bind,source="${{ github.workspace }}",target=/source,readonly \
            local-ai-api-gateway:latest \
            -ec '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends ripgrep >/dev/null
              cp -a /source /workspace
              chown -R app:app /workspace
              exec su -s /bin/sh app -c "cd /workspace && python -m pytest tests -v"
            '
